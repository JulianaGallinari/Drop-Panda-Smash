<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop & Smash - Acesso Restrito</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#080d1a] text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-[360px] space-y-6">

    <!-- Cabeçalho Fora do Card -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-black tracking-wider text-[#2563eb] uppercase">DROP & SMASH</h1>
      <p class="text-xs text-slate-400 font-medium">Painel de Controle e Gestão de Quadra</p>
    </div>

    <!-- Card Principal -->
    <div class="bg-[#111827] rounded-2xl border border-[#1e293d] p-6 shadow-2xl space-y-5">

      <!-- Ícone Dourado e Título -->
      <div class="text-center space-y-1">
        <div class="inline-flex justify-center items-center mb-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-amber-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
          </svg>
        </div>
        <h2 id="cardTitle" class="text-base font-bold text-white">Acesso Restrito</h2>
        <p id="cardSubtitle" class="text-xs text-slate-400">Digite seu PIN para acessar</p>
      </div>

      <!-- Alertas de Status -->
      <div id="msgAlerta" class="hidden text-xs p-3 rounded-xl text-center font-medium leading-relaxed"></div>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="formLogin" onsubmit="efetuarLogin(event)" class="space-y-4">
        <div>
          <input 
            type="password" 
            id="pinInput" 
            inputmode="numeric" 
            pattern="[0-9]*" 
            maxlength="8" 
            placeholder="• • • •" 
            required 
            autocomplete="off"
            autofocus
            class="w-full bg-[#1a2336] border border-[#2a364f] rounded-xl px-4 py-3 text-center text-xl font-mono tracking-[0.4em] text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:tracking-normal placeholder:font-sans"
          />
        </div>

        <button 
          type="submit" 
          id="btnSubmitLogin"
          class="w-full bg-[#2563eb] hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/20 active:scale-[0.98] transition-all flex justify-center items-center gap-2 text-sm">
          <span id="btnTextLogin">Entrar</span>
          <div id="spinnerLogin" class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></div>
        </button>
      </form>

      <!-- FORMULÁRIO DE CADASTRO (INICIALMENTE OCULTO) -->
      <form id="formCadastro" onsubmit="efetuarCadastro(event)" class="hidden space-y-4">
        <div>
          <input 
            type="text" 
            id="nomeCadastroInput" 
            placeholder="Nome Completo" 
            required 
            autocomplete="off"
            class="w-full bg-[#1a2336] border border-[#2a364f] rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all mb-3"
          />
          <input 
            type="password" 
            id="pinCadastroInput" 
            inputmode="numeric" 
            pattern="[0-9]*" 
            maxlength="8" 
            placeholder="Criar PIN (mín. 4 dígitos)" 
            required 
            autocomplete="off"
            class="w-full bg-[#1a2336] border border-[#2a364f] rounded-xl px-4 py-3 text-center text-lg font-mono tracking-[0.2em] text-white placeholder:tracking-normal placeholder:font-sans placeholder:text-xs placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
          />
        </div>

        <button 
          type="submit" 
          id="btnSubmitCadastro"
          class="w-full bg-[#2563eb] hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/20 active:scale-[0.98] transition-all flex justify-center items-center gap-2 text-sm">
          <span id="btnTextCadastro">Cadastrar Juiz</span>
          <div id="spinnerCadastro" class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></div>
        </button>
      </form>

      <!-- Botão de Alternância no Rodapé -->
      <div class="text-center pt-1">
        <button 
          type="button" 
          id="btnToggleModo" 
          onclick="alternarModo()" 
          class="text-xs text-slate-400 hover:text-slate-300 transition-colors underline focus:outline-none">
          Não tem conta? Cadastrar Novo Juiz
        </button>
      </div>

    </div>

  </div>

<script>
  // URL oficial do Apps Script configurada em modo Headless (POST)
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8ozRKqU-Hwoc5CeqPsdGvs90sN6CISmpcWDV0hZWCKG74rHU-ghxhZwC8efymA62oSA/exec";
  var modoAtual = 'login';

  // Função Headless Anti-CORS via POST com text/plain
  function chamarAPI(acao, parametros) {
    var dados = parametros || {};
    dados.acao = acao;

    return fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(dados)
    })
    .then(function(resposta) {
      if (!resposta.ok) {
        throw new Error("Erro HTTP: " + resposta.status);
      }
      return resposta.json();
    });
  }

  function alternarModo() {
    var formLogin = document.getElementById('formLogin');
    var formCadastro = document.getElementById('formCadastro');
    var cardTitle = document.getElementById('cardTitle');
    var cardSubtitle = document.getElementById('cardSubtitle');
    var btnToggleModo = document.getElementById('btnToggleModo');
    var msgAlerta = document.getElementById('msgAlerta');

    msgAlerta.classList.add('hidden');

    if (modoAtual === 'login') {
      modoAtual = 'cadastro';
      formLogin.classList.add('hidden');
      formCadastro.classList.remove('hidden');
      cardTitle.textContent = "Novo Cadastro";
      cardSubtitle.textContent = "Cadastre seu nome e PIN de acesso";
      btnToggleModo.textContent = "Já tem conta? Voltar ao Login";
      document.getElementById('nomeCadastroInput').focus();
    } else {
      modoAtual = 'login';
      formCadastro.classList.add('hidden');
      formLogin.classList.remove('hidden');
      cardTitle.textContent = "Acesso Restrito";
      cardSubtitle.textContent = "Digite seu PIN para acessar";
      btnToggleModo.textContent = "Não tem conta? Cadastrar Novo Juiz";
      document.getElementById('pinInput').focus();
    }
  }

  function efetuarLogin(event) {
    event.preventDefault();

    var pinInput = document.getElementById('pinInput');
    var btnSubmit = document.getElementById('btnSubmitLogin');
    var btnText = document.getElementById('btnTextLogin');
    var spinner = document.getElementById('spinnerLogin');

    var pin = pinInput.value.trim();
    if (!pin) return;

    exibirAlerta("Validando...", "info");
    btnSubmit.disabled = true;
    btnText.textContent = "Validando...";
    spinner.classList.remove('hidden');

    chamarAPI('login', { pin: pin })
      .then(function(resposta) {
        if (resposta && resposta.autorizado) {
          try {
            sessionStorage.setItem('juizLogado', JSON.stringify({ nome: resposta.nome, cargo: resposta.cargo }));
          } catch (e) {
            exibirAlerta("O telemóvel bloqueou o armazenamento. Utilize um separador normal.", "erro");
            btnSubmit.disabled = false;
            btnText.textContent = "Entrar";
            spinner.classList.add('hidden');
            return;
          }
          
          // Redirecionamento local direto para o painel hospedado externamente
          window.location.href = 'painel.html';
        } else {
          exibirAlerta((resposta && resposta.erro) ? resposta.erro : "PIN incorreto.", "erro");
          btnSubmit.disabled = false;
          btnText.textContent = "Entrar";
          spinner.classList.add('hidden');
        }
      })
      .catch(function(err) {
        exibirAlerta("Erro de rede ao contactar o servidor.", "erro");
        btnSubmit.disabled = false;
        btnText.textContent = "Entrar";
        spinner.classList.add('hidden');
      });
  }

  function efetuarCadastro(event) {
    event.preventDefault();

    var nomeInput = document.getElementById('nomeCadastroInput');
    var pinInput = document.getElementById('pinCadastroInput');
    var btnSubmit = document.getElementById('btnSubmitCadastro');
    var btnText = document.getElementById('btnTextCadastro');
    var spinner = document.getElementById('spinnerCadastro');

    var nome = nomeInput.value.trim();
    var pin = pinInput.value.trim();

    if (!nome || !pin) {
      exibirAlerta("Preencha todos os campos.", "erro");
      return;
    }

    btnSubmit.disabled = true;
    btnText.textContent = "Salvando...";
    spinner.classList.remove('hidden');

    chamarAPI('cadastrar', { nome: nome, pin: pin })
      .then(function(resposta) {
        if (resposta && resposta.sucesso) {
          exibirAlerta(resposta.mensagem || "Cadastro realizado com sucesso!", "sucesso");
          nomeInput.value = "";
          pinInput.value = "";
          
          btnSubmit.disabled = false;
          btnText.textContent = "Cadastrar Juiz";
          spinner.classList.add('hidden');
          
          setTimeout(function() { alternarModo(); }, 1500);
        } else {
          exibirAlerta((resposta && resposta.erro) ? resposta.erro : "Erro ao cadastrar.", "erro");
          btnSubmit.disabled = false;
          btnText.textContent = "Cadastrar Juiz";
          spinner.classList.add('hidden');
        }
      })
      .catch(function(err) {
        exibirAlerta("Erro de rede ao contactar o servidor.", "erro");
        btnSubmit.disabled = false;
        btnText.textContent = "Cadastrar Juiz";
        spinner.classList.add('hidden');
      });
  }

  function exibirAlerta(mensagem, tipo) {
    var msgAlerta = document.getElementById('msgAlerta');
    msgAlerta.textContent = mensagem;
    msgAlerta.className = "text-xs p-3 rounded-xl text-center font-medium leading-relaxed ";

    if (tipo === 'erro') {
      msgAlerta.className += "bg-rose-500/10 border border-rose-500/30 text-rose-400";
    } else if (tipo === 'sucesso') {
      msgAlerta.className += "bg-emerald-500/10 border border-emerald-500/30 text-emerald-400";
    } else {
      msgAlerta.className += "bg-blue-500/10 border border-blue-500/30 text-blue-400";
    }
    msgAlerta.classList.remove('hidden');
  }
</script>
 
</body>
</html>
