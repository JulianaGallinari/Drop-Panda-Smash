<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop & Smash - Painel do Juiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#080d1a] text-slate-100 min-h-screen pb-12">

  <!-- BARRA SUPERIOR -->
  <header class="bg-[#111827] border-b border-[#1e293d] sticky top-0 z-50 shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-black tracking-wider text-[#2563eb] uppercase">DROP & SMASH</h1>
        <p id="lblJuiz" class="text-xs text-slate-400 font-medium">Carregando perfil...</p>
      </div>
      <button 
        onclick="efetuarLogout()" 
        class="bg-[#1a2336] hover:bg-[#2563eb] text-slate-300 hover:text-white text-xs font-semibold px-3 py-1.5 rounded-lg border border-[#2a364f] transition-all">
        Sair
      </button>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="max-w-3xl mx-auto px-4 pt-6 space-y-6">

    <!-- ALERTA DE MENSAGENS -->
    <div id="msgAlerta" class="hidden text-xs p-3.5 rounded-xl text-center font-medium leading-relaxed"></div>

    <!-- CONTROLE DE MODO DE JOGO -->
    <div class="bg-[#111827] p-3.5 rounded-2xl border border-[#1e293d] flex flex-col sm:flex-row items-center justify-between gap-3 shadow-lg">
      <label for="seletorModo" class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        Modo de Pontuação Ativo:
      </label>
      <select 
        id="seletorModo" 
        class="w-full sm:w-auto bg-[#1a2336] border border-[#2a364f] rounded-xl px-3.5 py-2 text-xs font-bold text-amber-400 focus:outline-none focus:border-blue-500 transition-all">
        <option value="individual">Individual (Rainha da Praia / Piscina)</option>
        <option value="dupla">Dupla Fixa</option>
      </select>
    </div>

    <!-- ABAS DE NAVEGAÇÃO -->
    <div class="flex bg-[#111827] p-1 rounded-xl border border-[#1e293d] gap-1">
      <button 
        id="btnAbaFase1" 
        onclick="mudarAba('fase1')" 
        class="flex-1 py-2.5 text-xs font-bold rounded-lg transition-all bg-[#2563eb] text-white shadow">
        1ª Fase (Grupos)
      </button>
      <button 
        id="btnAbaPraia" 
        onclick="mudarAba('praia')" 
        class="flex-1 py-2.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white">
        Rainha da Praia
      </button>
      <button 
        id="btnAbaPiscina" 
        onclick="mudarAba('piscina')" 
        class="flex-1 py-2.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white">
        Rainha da Piscina
      </button>
    </div>

    <!-- SEÇÃO 1: FASE DE GRUPOS -->
    <section id="secFase1" class="space-y-5">
      
      <!-- SELETOR DE GRUPO -->
      <div class="bg-[#111827] p-5 rounded-2xl border border-[#1e293d] space-y-3 shadow-lg">
        <label for="selectGrupo" class="block text-xs font-bold uppercase tracking-wider text-slate-400">
          Selecione o Grupo
        </label>
        <select 
          id="selectGrupo" 
          onchange="carregarAtletasGrupo()" 
          class="w-full bg-[#1a2336] border border-[#2a364f] rounded-xl px-4 py-3 text-sm font-semibold text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
          <option value="">Carregando grupos...</option>
        </select>
      </div>

      <!-- FORMULÁRIO DE LANÇAMENTO DE PONTOS -->
      <div id="cardLancamentoGrupo" class="hidden bg-[#111827] p-6 rounded-2xl border border-[#1e293d] space-y-5 shadow-lg">
        <div class="flex items-center justify-between border-b border-[#1e293d] pb-3">
          <h2 id="tituloGrupoSelecionado" class="text-base font-bold text-white">Grupo -</h2>
          <span id="badgeStatusGrupo" class="text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider"></span>
        </div>

        <form id="formPontosGrupo" onsubmit="salvarPontosGrupo(event)" class="space-y-4">
          <div id="containerAtletas" class="space-y-3">
            <!-- Inputs gerados via JS -->
          </div>

          <button 
            type="submit" 
            id="btnSalvarGrupo"
            class="w-full bg-[#2563eb] hover:bg-blue-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-600/20 active:scale-[0.98] transition-all flex justify-center items-center gap-2 text-sm">
            <span id="btnTextGrupo">Salvar Pontuações</span>
            <div id="spinnerGrupo" class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></div>
          </button>
        </form>
      </div>

    </section>

    <!-- SEÇÃO 2: MATA-MATA (PRAIA E PISCINA) -->
    <section id="secMataMata" class="hidden space-y-5">
      <div class="flex items-center justify-between px-1">
        <h2 id="tituloMataMata" class="text-base font-bold text-white">Chave Mata-Mata</h2>
        <button onclick="carregarConfrontosMataMata()" class="text-xs text-blue-400 hover:underline flex items-center gap-1">
          🔄 Atualizar Chave
        </button>
      </div>

      <div id="containerMataMata" class="space-y-4">
        <!-- Confrontos gerados via JS -->
      </div>
    </section>

  </main>

  <script>
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8ozRKqU-Hwoc5CeqPsdGvs90sN6CISmpcWDV0hZWCKG74rHU-ghxhZwC8efymA62oSA/exec";
  var abaAtiva = 'fase1';
  var gruposCarregados = [];
  var confrontosMataMataCarregados = [];
  var juizAtual = null;

  function chamarAPI(acao, parametros) {
    var dados = parametros || {};
    dados.acao = acao;

    return fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(dados)
    })
    .then(function(resposta) {
      if (!resposta.ok) {
        throw new Error("Erro HTTP: " + resposta.status);
      }
      return resposta.json();
    });
  }

  window.addEventListener('DOMContentLoaded', function() {
    var sessao = sessionStorage.getItem('juizLogado');
    if (!sessao) {
      window.location.href = 'login.html';
      return;
    }

    juizAtual = JSON.parse(sessao);
    document.getElementById('lblJuiz').textContent = "Juiz: " + (juizAtual.nome || "Autenticado");

    carregarListaGrupos();
  });

  function efetuarLogout() {
    sessionStorage.removeItem('juizLogado');
    sessionStorage.clear();
    window.location.href = 'login.html';
  }

  function mudarAba(aba) {
    abaAtiva = aba;
    
    var btnFase1 = document.getElementById('btnAbaFase1');
    var btnPraia = document.getElementById('btnAbaPraia');
    var btnPiscina = document.getElementById('btnAbaPiscina');
    
    var secFase1 = document.getElementById('secFase1');
    var secMataMata = document.getElementById('secMataMata');

    [btnFase1, btnPraia, btnPiscina].forEach(function(btn) {
      btn.className = "flex-1 py-2.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-white";
    });

    if (aba === 'fase1') {
      btnFase1.className = "flex-1 py-2.5 text-xs font-bold rounded-lg transition-all bg-[#2563eb] text-white shadow";
      secFase1.classList.remove('hidden');
      secMataMata.classList.add('hidden');
    } else {
      var btnAlvo = (aba === 'praia') ? btnPraia : btnPiscina;
      btnAlvo.className = "flex-1 py-2.5 text-xs font-bold rounded-lg transition-all bg-[#2563eb] text-white shadow";
      secFase1.classList.add('hidden');
      secMataMata.classList.remove('hidden');
      
      document.getElementById('tituloMataMata').textContent = (aba === 'praia') ? "Rainha da Praia" : "Rainha da Piscina";
      carregarConfrontosMataMata();
    }
  }

  // LÓGICA DA 1ª FASE (GRUPOS)
  function carregarListaGrupos() {
    chamarAPI('listarGrupos')
      .then(function(grupos) {
        gruposCarregados = grupos || [];
        var select = document.getElementById('selectGrupo');
        select.innerHTML = '<option value="">-- Selecione um grupo --</option>';

        if (gruposCarregados.length === 0) {
          select.innerHTML = '<option value="">Nenhum grupo encontrado</option>';
          return;
        }

        gruposCarregados.forEach(function(g) {
          var opt = document.createElement('option');
          opt.value = g.idGrupo;
          opt.textContent = g.idGrupo + " (" + g.status + ")";
          select.appendChild(opt);
        });
      })
      .catch(function(err) {
        exibirAlerta("Erro ao carregar lista de grupos: " + err.message, "erro");
      });
  }

  function carregarAtletasGrupo() {
    var idGrupo = document.getElementById('selectGrupo').value;
    var cardLancamento = document.getElementById('cardLancamentoGrupo');
    var containerAtletas = document.getElementById('containerAtletas');
    var tituloGrupo = document.getElementById('tituloGrupoSelecionado');
    var badgeStatus = document.getElementById('badgeStatusGrupo');

    if (!idGrupo) {
      cardLancamento.classList.add('hidden');
      return;
    }

    var grupo = gruposCarregados.find(function(g) { return g.idGrupo === idGrupo; });
    if (!grupo) return;

    tituloGrupo.textContent = "Lançamento de Pontos - " + grupo.idGrupo;
    
    if (grupo.status === 'Concluído') {
      badgeStatus.textContent = "Concluído";
      badgeStatus.className = "text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
    } else {
      badgeStatus.textContent = "Pendente";
      badgeStatus.className = "text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider bg-amber-500/10 text-amber-400 border border-amber-500/20";
    }

    containerAtletas.innerHTML = "";
    grupo.atletas.forEach(function(atleta, index) {
      var div = document.createElement('div');
      div.className = "flex items-center justify-between bg-[#1a2336] p-3.5 rounded-xl border border-[#2a364f]";
      div.innerHTML = `
        <label class="text-xs font-semibold text-white truncate max-w-[200px]">${atleta || 'Atleta ' + (index+1)}</label>
        <input 
          type="number" 
          min="0" 
          max="100" 
          data-atleta="${atleta}" 
          placeholder="0" 
          required 
          class="w-20 bg-[#0d1527] border border-[#2a364f] rounded-lg px-3 py-2 text-center text-base font-mono font-bold text-amber-400 focus:outline-none focus:border-blue-500"
        />
      `;
      containerAtletas.appendChild(div);
    });

    cardLancamento.classList.remove('hidden');
  }

  function salvarPontosGrupo(e) {
    e.preventDefault();
    
    var modoAtivo = document.getElementById('seletorModo').value;
    var idGrupo = document.getElementById('selectGrupo').value;
    var inputs = document.querySelectorAll('#containerAtletas input');
    var btnSalvar = document.getElementById('btnSalvarGrupo');
    var btnText = document.getElementById('btnTextGrupo');
    var spinner = document.getElementById('spinnerGrupo');

    var pontosObjeto = {};
    var atletasLista = [];
    var maiorPontuacao = 0;

    inputs.forEach(function(input) {
      var nomeAtleta = input.getAttribute('data-atleta');
      var pts = Number(input.value) || 0;
      pontosObjeto[nomeAtleta] = pts;
      atletasLista.push(nomeAtleta);
      if (pts > maiorPontuacao) maiorPontuacao = pts;
    });

    btnSalvar.disabled = true;
    btnText.textContent = "Gravando...";
    spinner.classList.remove('hidden');

    var promessaEnvio;

    if (modoAtivo === 'individual') {
      promessaEnvio = chamarAPI('salvarPontosIndividual', {
        atletas: atletasLista,
        pontos: maiorPontuacao,
        fase: 'grupos'
      }).then(function() {
        return chamarAPI('salvarPontosGrupo', { idGrupo: idGrupo, pontos: pontosObjeto });
      });
    } else {
      promessaEnvio = chamarAPI('salvarPontosGrupo', { idGrupo: idGrupo, pontos: pontosObjeto });
    }

    promessaEnvio
      .then(function(res) {
        btnSalvar.disabled = false;
        btnText.textContent = "Salvar Pontuações";
        spinner.classList.add('hidden');

        if (res && res.sucesso) {
          exibirAlerta("Pontuação registrada com sucesso (" + (modoAtivo === 'individual' ? 'Acúmulo Individual' : 'Dupla Fixa') + ")!", "sucesso");
          carregarListaGrupos();
        } else {
          exibirAlerta((res && res.erro) ? res.erro : "Erro ao salvar.", "erro");
        }
      })
      .catch(function(err) {
        btnSalvar.disabled = false;
        btnText.textContent = "Salvar Pontuações";
        spinner.classList.add('hidden');
        exibirAlerta("Erro de conexão: " + err.message, "erro");
      });
  }

  // LÓGICA DO MATA-MATA
  function carregarConfrontosMataMata() {
    var abaNome = (abaAtiva === 'praia') ? 'rainha_praia' : 'rainha_piscina';
    var container = document.getElementById('containerMataMata');
    container.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">Carregando chave de confrontos...</p>';

    chamarAPI('listarMataMata', { abaNome: abaNome })
      .then(function(confrontos) {
        container.innerHTML = "";
        confrontosMataMataCarregados = confrontos || [];

        if (!confrontos || confrontos.length === 0) {
          container.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">O mata-mata ainda não foi gerado. Conclua todos os grupos da 1ª Fase primeiro.</p>';
          return;
        }

        confrontos.forEach(function(c) {
          var card = document.createElement('div');
          card.className = "bg-[#111827] p-5 rounded-2xl border border-[#1e293d] space-y-4 shadow-lg";

          var isConcluido = (c.status === 'Concluído');
          var statusBadge = isConcluido 
            ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Concluído</span>`
            : `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">Pendente</span>`;

          var isModoDuplas = !c.atleta3 || c.atleta3 === '';

          var inputsHTML = "";
          if (isModoDuplas) {
            inputsHTML = `
              <div class="grid grid-cols-2 gap-3">
                <!-- QUADRO DUPLA A (VERMELHO) -->
                <div class="bg-red-950/30 border border-red-500/30 p-3 rounded-xl text-center space-y-2">
                  <span class="text-[10px] font-bold text-red-400 uppercase tracking-wider block">Dupla A</span>
                  <p class="text-xs font-bold text-white truncate">${c.atleta1} / ${c.atleta2}</p>
                  <input type="number" id="p1_${c.idConfronto}" value="${c.pontos1 || ''}" placeholder="0" class="w-20 bg-[#0d1527] border border-red-500/50 rounded-lg p-2 text-center text-sm font-bold text-amber-400 mx-auto block focus:outline-none focus:ring-1 focus:ring-red-400" />
                </div>

                <!-- QUADRO DUPLA B (AZUL) -->
                <div class="bg-blue-950/30 border border-blue-500/30 p-3 rounded-xl text-center space-y-2">
                  <span class="text-[10px] font-bold text-blue-400 uppercase tracking-wider block">Dupla B</span>
                  <p class="text-xs font-bold text-white truncate">${c.atleta3 || 'Dupla B'}</p>
                  <input type="number" id="p2_${c.idConfronto}" value="${c.pontos2 || ''}" placeholder="0" class="w-20 bg-[#0d1527] border border-blue-500/50 rounded-lg p-2 text-center text-sm font-bold text-amber-400 mx-auto block focus:outline-none focus:ring-1 focus:ring-blue-400" />
                </div>
              </div>
            `;
          } else {
            inputsHTML = `
              <div class="grid grid-cols-2 gap-2">
                <div class="bg-[#1a2336] p-2.5 rounded-xl border border-[#2a364f] space-y-1">
                  <span class="text-[11px] font-semibold text-white block truncate">${c.atleta1}</span>
                  <input type="number" id="p1_${c.idConfronto}" value="${c.pontos1 || ''}" placeholder="0" class="w-full bg-[#0d1527] border border-[#2a364f] rounded-lg p-1.5 text-center text-sm font-bold text-amber-400" />
                </div>
                <div class="bg-[#1a2336] p-2.5 rounded-xl border border-[#2a364f] space-y-1">
                  <span class="text-[11px] font-semibold text-white block truncate">${c.atleta2}</span>
                  <input type="number" id="p2_${c.idConfronto}" value="${c.pontos2 || ''}" placeholder="0" class="w-full bg-[#0d1527] border border-[#2a364f] rounded-lg p-1.5 text-center text-sm font-bold text-amber-400" />
                </div>
                <div class="bg-[#1a2336] p-2.5 rounded-xl border border-[#2a364f] space-y-1">
                  <span class="text-[11px] font-semibold text-white block truncate">${c.atleta3}</span>
                  <input type="number" id="p3_${c.idConfronto}" value="${c.pontos3 || ''}" placeholder="0" class="w-full bg-[#0d1527] border border-[#2a364f] rounded-lg p-1.5 text-center text-sm font-bold text-amber-400" />
                </div>
                <div class="bg-[#1a2336] p-2.5 rounded-xl border border-[#2a364f] space-y-1">
                  <span class="text-[11px] font-semibold text-white block truncate">${c.atleta4}</span>
                  <input type="number" id="p4_${c.idConfronto}" value="${c.pontos4 || ''}" placeholder="0" class="w-full bg-[#0d1527] border border-[#2a364f] rounded-lg p-1.5 text-center text-sm font-bold text-amber-400" />
                </div>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="flex items-center justify-between border-b border-[#1e293d] pb-2.5">
              <div>
                <span class="text-xs font-bold text-blue-400 uppercase tracking-wider">${c.fase}</span>
                <span class="text-[10px] text-slate-500 ml-2">(${c.idConfronto})</span>
              </div>
              ${statusBadge}
            </div>

            ${inputsHTML}

            ${c.classificadas ? `<p class="text-xs text-emerald-400 font-medium"><b>Classificadas:</b> ${c.classificadas}</p>` : ''}

            <button 
              onclick="salvarMataMata('${abaNome}', '${c.idConfronto}', ${isModoDuplas})" 
              class="w-full bg-[#2563eb] hover:bg-blue-500 text-white font-bold py-2.5 px-3 rounded-xl text-xs transition-all shadow">
              Salvar Placar
            </button>
          `;

          container.appendChild(card);
        });
      })
      .catch(function(err) {
        container.innerHTML = '<p class="text-xs text-rose-400 text-center py-8">Erro ao carregar confrontos: ' + err.message + '</p>';
      });
  }

  function salvarMataMata(abaNome, idConfronto, isModoDuplas) {
    var modoAtivo = document.getElementById('seletorModo').value;
    var confronto = confrontosMataMataCarregados.find(function(item) { return item.idConfronto === idConfronto; });
    var pontosArray = [];
    
    var p1 = Number(document.getElementById('p1_' + idConfronto).value) || 0;
    var p2 = Number(document.getElementById('p2_' + idConfronto).value) || 0;
    pontosArray.push(p1);
    pontosArray.push(p2);

    if (!isModoDuplas) {
      var p3 = Number(document.getElementById('p3_' + idConfronto).value) || 0;
      var p4 = Number(document.getElementById('p4_' + idConfronto).value) || 0;
      pontosArray.push(p3);
      pontosArray.push(p4);
    }

    exibirAlerta("Salvando confronto...", "info");

    var promessaEnvio;

    if (modoAtivo === 'individual' && confronto) {
      var atletasNoJogo = [confronto.atleta1, confronto.atleta2, confronto.atleta3, confronto.atleta4].filter(Boolean);
      var maiorPontoMataMata = Math.max.apply(null, pontosArray);

      promessaEnvio = chamarAPI('salvarPontosIndividual', {
        atletas: atletasNoJogo,
        pontos: maiorPontoMataMata,
        fase: 'matamata'
      }).then(function() {
        return chamarAPI('salvarMataMata', { abaNome: abaNome, idConfronto: idConfronto, pontosArray: pontosArray });
      });
    } else {
      promessaEnvio = chamarAPI('salvarMataMata', { abaNome: abaNome, idConfronto: idConfronto, pontosArray: pontosArray });
    }

    promessaEnvio
      .then(function(res) {
        if (res && res.sucesso) {
          exibirAlerta("Placar do mata-mata salvo com sucesso!", "sucesso");
          carregarConfrontosMataMata();
        } else {
          exibirAlerta((res && res.erro) ? res.erro : "Erro ao salvar placar.", "erro");
        }
      })
      .catch(function(err) {
        exibirAlerta("Erro de conexão: " + err.message, "erro");
      });
  }

  function exibirAlerta(msg, tipo) {
    var box = document.getElementById('msgAlerta');
    box.textContent = msg;
    box.className = "text-xs p-3.5 rounded-xl text-center font-medium leading-relaxed ";

    if (tipo === 'erro') {
      box.className += "bg-rose-500/10 border border-rose-500/30 text-rose-400";
    } else if (tipo === 'sucesso') {
      box.className += "bg-emerald-500/10 border border-emerald-500/30 text-emerald-400";
    } else {
      box.className += "bg-blue-500/10 border border-blue-500/30 text-blue-400";
    }

    box.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  </script>
</body>
</html>
